[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-graph7"
version = "0.3.1"
description = "Knowledge graph plugin for Terraform, Kubernetes, GitHub Actions, and Docker Compose infrastructure files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vedang Parab", email = "parabvedang007@gmail.com"},
]
keywords = ["terraform", "kubernetes", "infrastructure", "knowledge-graph", "mcp", "claude", "iac", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "networkx>=3.0",
    "python-hcl2>=4.3",
    "ruamel.yaml>=0.18",
    "click>=8.1",
    "mcp>=1.0",
    "pathspec>=0.12",
    "watchdog>=4.0",
]

[project.urls]
Homepage = "https://github.com/vparab7/infra-graph"
Repository = "https://github.com/vparab7/infra-graph"
"Bug Tracker" = "https://github.com/vparab7/infra-graph/issues"
Changelog = "https://github.com/vparab7/infra-graph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4", "mypy>=1.0"]
deep = ["graspologic>=3.0"]

[project.scripts]
infra-graph = "infra_graph.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["infra_graph"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
